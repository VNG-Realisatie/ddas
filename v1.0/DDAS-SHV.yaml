openapi: 3.1.0
info:
  title: DDAS Gegevens Uitwissel API - SHV
  description: |
    API voor het uitwisselen van Schuldhulpverleningsgegevens (SHV) met het CBS.
    Beveiligd met OAuth 2.0 Client Credentials Grant.
    Payload-integriteit en authenticiteit via JAdES payload signing conform Geonovum
    KP-APIs signing-jades module (header: nlgov-adr-payload-sig, PS256, detached,
    alleen digest getekend, key meegestuurd via x5c).

    Error handling is FSC-compatibel (Logius FSC Core 1.1.2): bij FSC-gerelateerde fouten
    wordt de header `Fsc-Error-Code` meegegeven met een geldige ERROR_CODE_... waarde.
  version: 2.0.0
  contact:
    name: DDAS-beheer
    url: https://divosa.nl/ddas

servers:
  - url: https://api.gegevensuitwissel.com/v1
    description: Productieomgeving
  - url: https://api-test.gegevensuitwissel.com/v1
    description: Acceptatie-/testomgeving

security:
  - OAuth2: [read]

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.gegevensuitwissel.com/token
          scopes:
            read: Toegang om SHV-gegevens op te halen

  parameters:
    DigestHeader:
      name: Digest
      in: header
      required: true
      description: |
        SHA-256 digest van de HTTP-payload. De digest wordt betrokken in de JAdES signing input
        doordat de protected header `sigD.pars` exact `["digest"]` bevat.
      schema:
        type: string
        pattern: '^SHA-256=[A-Za-z0-9+/=]{43,44}$'
        example: 'SHA-256=47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='

    NlgovAdrPayloadSigHeader:
      name: nlgov-adr-payload-sig
      in: header
      required: true
      description: |
        Detached JWS voor de payload, conform de DDAS-invulling van de Geonovum ADR.
        Zie `components.headers.NlgovAdrPayloadSig` voor de vereiste protected-headerparameters
        en validatieregels.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]+\.\.[A-Za-z0-9_-]+$'
        example: 'eyJhbGciOiJQUzI1NiIsImI2NCI6ZmFsc2UsImNyaXQiOlsic2lnRCIsImI2NCJdLCJraWQiOiJzaHYtY2VydC0yMDI2IiwieDVjIjpbIkJBU0U2NERFUkVOREVOVElUWUNFUlRJRklDQVRFIiwiQkFTRTY0REVSSU5URVJNRURJQVRFQ0VSVElGSUNBVEUiXSwic2lnRCI6eyJtSWQiOiJodHRwOi8vdXJpLmV0c2kub3JnLzE5MTgyL0h0dHBIZWFkZXJzIiwicGFycyI6WyJkaWdlc3QiXX19..aWxsdXN0cmF0aXZlLXNpZ25hdHVyZS12YWx1ZQ'

  headers:
    Digest:
      description: |
        SHA-256 digest van de HTTP-payload. Verplicht bij een request of response met een body
        die conform ADR payload signing wordt ondertekend. De waarde wordt opgenomen in de
        JAdES signing input via `sigD.pars: ["digest"]`.
      schema:
        type: string
        pattern: '^SHA-256=[A-Za-z0-9+/=]{43,44}$'
        example: 'SHA-256=47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='
      required: true

    NlgovAdrPayloadSig:
      required: true
      description: |
        Detached JWS Compact Serialization voor payload signing conform de Geonovum ADR
        "HTTP Message and payload signing with JAdES".

        DDAS gebruikt een zo beperkt mogelijk profiel:
        - `alg`: `PS256`;
        - `b64`: `false`, zoals vereist voor het JAdES HttpHeaders-mechanisme;
        - `crit`: bevat minimaal `sigD` en `b64`;
        - `sigD.mId`: exact `http://uri.etsi.org/19182/HttpHeaders`;
        - `sigD.pars`: exact `["digest"]`;
        - `kid`: identifier van de gebruikte signing key / het signingcertificaat;
        - `x5c`: X.509-certificaatketen, met het signingcertificaat als eerste element.

        `jku` en JWKS worden niet gebruikt. De publieke sleutel wordt afgeleid uit het eerste
        certificaat in `x5c`. Het meegestuurde certificaat creëert op zichzelf geen vertrouwen:
        de ontvanger valideert de certificaatketen tegen een lokaal vertrouwde PKIoverheid
        trust anchor en controleert geldigheidsduur en intrekkingsstatus (OCSP of CRL).

        Omdat sprake is van een detached JWS, is het payloadsegment in de verzonden Compact
        Serialization leeg: `BASE64URL(ProtectedHeader)..BASE64URL(Signature)`.

        Voorbeeld van de gedecodeerde protected header:
        `{
          "alg": "PS256",
          "b64": false,
          "crit": ["sigD", "b64"],
          "kid": "shv-cert-2026",
          "x5c": [
            "<BASE64_DER_END_ENTITY_CERTIFICATE>",
            "<BASE64_DER_INTERMEDIATE_CERTIFICATE>"
          ],
          "sigD": {
            "mId": "http://uri.etsi.org/19182/HttpHeaders",
            "pars": ["digest"]
          }
        }`
      schema:
        type: string
        description: JWS Compact Serialization met detached payload.
        pattern: '^[A-Za-z0-9_-]+\.\.[A-Za-z0-9_-]+$'
        example: 'eyJhbGciOiJQUzI1NiIsImI2NCI6ZmFsc2UsImNyaXQiOlsic2lnRCIsImI2NCJdLCJraWQiOiJzaHYtY2VydC0yMDI2IiwieDVjIjpbIkJBU0U2NERFUkVOREVOVElUWUNFUlRJRklDQVRFIiwiQkFTRTY0REVSSU5URVJNRURJQVRFQ0VSVElGSUNBVEUiXSwic2lnRCI6eyJtSWQiOiJodHRwOi8vdXJpLmV0c2kub3JnLzE5MTgyL0h0dHBIZWFkZXJzIiwicGFycyI6WyJkaWdlc3QiXX19..aWxsdXN0cmF0aXZlLXNpZ25hdHVyZS12YWx1ZQ'

    Fsc-Error-Code:
      description: |
        Verplichte FSC-header bij fouten conform FSC Core 1.1.2 (Inway/Outway).
        Bevat een ERROR_CODE_... uit de FSC-standaard (bijv. ERROR_CODE_ACCESS_TOKEN_INVALID).
      schema:
        type: string
        enum:
          - ERROR_CODE_ACCESS_TOKEN_MISSING
          - ERROR_CODE_ACCESS_TOKEN_INVALID
          - ERROR_CODE_ACCESS_TOKEN_EXPIRED
          - ERROR_CODE_WRONG_GROUP_ID_IN_TOKEN
          - ERROR_CODE_SERVICE_NOT_FOUND
          - ERROR_CODE_SERVICE_UNREACHABLE
          - ERROR_CODE_METHOD_UNSUPPORTED
      example: ERROR_CODE_ACCESS_TOKEN_INVALID

  schemas:
    Uitwisselmodel:
      $ref: 'https://raw.githubusercontent.com/VNG-Realisatie/ddas/main/v1.0/json_schema_Uitwisselmodel.json'

    Paginering:
      type: object
      required:
        - pageSize
        - currentPage
        - totalPages
        - totalRecords
      properties:
        pageSize:
          description: Het aantal records per pagina
          type: integer
          minimum: 1
          example: 25000
        currentPage:
          description: De huidige pagina
          type: integer
          minimum: 1
          example: 1
        totalPages:
          description: Het totaal aantal beschikbare pagina's
          type: integer
          minimum: 1
          example: 3
        totalRecords:
          description: Het totaal aantal te versturen records
          type: integer
          minimum: 0
          example: 72643

    GegevensRequest:
      type: object
      properties:
        aanleverperiodeStartdatum:
          type: string
          format: date
          example: "2025-01-01"
        aanleverperiodeEinddatum:
          type: string
          format: date
          example: "2025-12-31"
        aanleverendeOrganisatie:
          type: string
          example: "Naam Gegevensleverancier"
        page:
          type: integer
          minimum: 1
          example: 1
        pageSize:
          type: integer
          minimum: 1
          example: 25000
      additionalProperties: false

    FscError:
      type: object
      required: [code, domain]
      properties:
        code:
          type: string
          description: ERROR_CODE_... uit FSC standaard
          example: ERROR_CODE_ACCESS_TOKEN_INVALID
        domain:
          type: string
          enum: [ERROR_DOMAIN_INWAY, ERROR_DOMAIN_OUTWAY]
          example: ERROR_DOMAIN_INWAY
        title:
          type: string
          example: Ongeldige access token
        detail:
          type: string
          example: De meegegeven Fsc-Authorization token is ongeldig of verlopen
        status:
          type: integer
          example: 401

    ProblemDetails:
      type: object
      description: Probleemdetails volgens RFC 7807 / RFC 9457.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: URI die het type fout identificeert.
          example: "https://api.example.nl/problems/ongeldig-request"
        title:
          type: string
          description: Korte, leesbare omschrijving van het probleemtype.
          example: "Ongeldig request"
        status:
          type: integer
          description: HTTP-statuscode.
          example: 400
        detail:
          type: string
          description: Specifieke toelichting op deze fout.
          example: "De parameter page moet groter zijn dan of gelijk zijn aan 1."
        instance:
          type: string
          format: uri-reference
          description: URI-referentie naar deze specifieke foutinstantie.
          example: "/vs?aanleverperiodeStartdatum=2026-01-01&page=0"

paths:
  /gegevens:
    post:
      summary: Aanvragen en ontvangen van SHV-gegevens
      operationId: postGegevens
      description: |
        Stuurt een verzoek om SHV-gegevens over een bepaalde periode / organisatie.
        Het verzoek én het antwoord worden beschermd met een `Digest` header en een
        `nlgov-adr-payload-sig` header. DDAS gebruikt JAdES payload signing conform de
        Geonovum ADR: PS256, detached JWS en het HttpHeaders-mechanisme waarbij uitsluitend
        de `digest` van de payload in de signing input wordt betrokken.
      security:
        - OAuth2: [read]
      parameters:
        - $ref: '#/components/parameters/DigestHeader'
        - $ref: '#/components/parameters/NlgovAdrPayloadSigHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GegevensRequest'
      responses:
        '200':
          description: Succesvol antwoord met de gevraagde SHV-gegevens
          headers:
            Digest:
              $ref: '#/components/headers/Digest'
            nlgov-adr-payload-sig:
              $ref: '#/components/headers/NlgovAdrPayloadSig'
          content:
            application/json:
              schema:
                type: object
                required:
                  - gegevens
                properties:
                  gegevens:
                    $ref: '#/components/schemas/Uitwisselmodel'
                  paginering:
                    allOf:
                      - $ref: '#/components/schemas/Paginering'
                    description: >
                      Alleen aanwezig als de gegevenslevering gepagineerd wordt.
                      Als dit object aanwezig is, zijn alle velden binnen Paginering verplicht.

        '400':
          description: Ongeldig verzoek (bijv. ongeldige filters of syntaxis)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

        '401':
          description: Geen of ongeldige authenticatie (FSC-compatibel)
          headers:
            Fsc-Error-Code:
              $ref: '#/components/headers/Fsc-Error-Code'
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/FscError'

        '403':
          description: Toegang geweigerd (bijv. verkeerde groep in token)
          headers:
            Fsc-Error-Code:
              $ref: '#/components/headers/Fsc-Error-Code'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/FscError'

        '404':
          description: Service of resource niet gevonden
          headers:
            Fsc-Error-Code:
              $ref: '#/components/headers/Fsc-Error-Code'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/FscError'

        '405':
          description: Niet-ondersteunde HTTP-methode (FSC Outway fout)
          headers:
            Fsc-Error-Code:
              $ref: '#/components/headers/Fsc-Error-Code'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/FscError'

        '422':
          description: Request syntactisch correct, maar inhoudelijk niet verwerkbaar
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

        '429':
          description: Rate limit overschreden

        '502':
          description: Service niet bereikbaar (FSC Inway fout)
          headers:
            Fsc-Error-Code:
              $ref: '#/components/headers/Fsc-Error-Code'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/FscError'