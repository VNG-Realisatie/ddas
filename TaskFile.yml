# Taskfile for automating the GGM deployment process
#
# This Taskfile defines tasks for:
# - Installing the Python tooling (crunch_uml, mkdocs, mike) in a local virtualenv
# - Validating required tools and variables
# - Importing an XMI file into Crunch UML and transforming it naar een informatiemodel en uitwisselmodel
# - Generating a JSON Schema from the uitwisselmodel
# - Generating Markdown documentation from the informatiemodel
# - Deploying documentation with MkDocs and Mike
# - Publishing documentation to GitHub Pages
#
# Usage:
# - Run `task install` once to create the .venv with the tooling (other tasks do this automatically)
# - Run `task` to execute the default task (full-deploy)
# - Run `task --list` to see all available tasks
# - Run `task <taskname>` to execute a specific task
#
# Environment:
# - A `.env` file is used to load configuration variables like VERSION, XMI_FILE, etc.
# - Python tooling runs from `.venv` (see `requirements-tools.txt`), never from a global installation.
#
# Versiebeheer:
# - Het JSON-schema wordt bij elke deploy opnieuw gegenereerd uit het model. Met dezelfde data
#   (XMI, plugins, tooling-versies) moet dat exact hetzelfde schema opleveren; een uitgebracht
#   schema mag na een deploy dus geen git-diff tonen.
#
# Examples:
# - To install the tooling: `task install`
# - To check preconditions: `task prepare:check-tools && task prepare:check-vars`
# - To import the XMI file and transform the model: `task import:model`
# - To generate the JSON schema: `task generate:json-schema`
# - To generate the documentation: `task generate:docs`
# - To deploy the documentation locally: `task publish:local`
# - To publish the documentation to GitHub Pages: `task publish:github`
# - To perform the entire deployment sequence: `task full-deploy`
#
# Author: Arjen Brienen
# Last Updated: 1 oktober 2026
version: '3'

# Default task wordt uitgevoerd bij 'task' zonder argument
silent: true
default: full-deploy

dotenv: ['.env']

env:
  # crunch_uml importeert de `translators`-library (crunch_uml/lang.py). Bij het
  # importeren bepaalt die library via een geolocatie-call welke Google/Bing-server
  # gebruikt moet worden. Lukt die call niet (offline, firewall, dienst down), dan
  # valt de library terug op een interactieve input()-prompt
  # ("Please input your server region need to visit") en blijft de build hangen.
  # Deze variabele zet de regio vast, zodat de geolocatie-call helemaal overgeslagen
  # wordt. De DDAS-build vertaalt niets, dus de waarde is verder niet van belang
  # (alles behalve "China" wordt binnen translators naar regio "EN" gemapt).
  translators_default_region: "Netherlands"
  # crunch_uml ordent keys en `required`-waarden in het JSON-schema via Python-sets. Met een
  # willekeurige hash-seed verschilt die volgorde per run; een vaste seed maakt de output
  # reproduceerbaar (dezelfde data levert hetzelfde schema op). Zie ook tools/postprocess_jsonschema.py.
  PYTHONHASHSEED: "0"

vars:
  VERSION_DIR: "./{{.VERSION}}"
  XMI: "data/{{.XMI_FILE}}"
  CRUNCH_UML_DB: "./crunch_uml.db"
  DOCS: "./docs"
  DEFS: "./docs/definities"
  PUBLISH: "false"
  JSON: "{{.VERSION_DIR}}/{{.JSON_SCHEMA}}"
  # Python-tooling uit de lokale virtualenv; crunch_uml ondersteunt Python < 3.14.
  PYTHON_VERSION: "3.13"
  VENV_BIN: "{{.ROOT_DIR}}/.venv/bin"
  # Deze URL staat hier en niet in .env: zodra de Taskfile een `env:`-blok heeft, worden
  # template-variabelen in .env-waarden niet meer geëxpandeerd. {{.VERSION}} werd dan leeg
  # en de $id van het schema werd ".../main//json_schema_Uitwisselmodel.json".
  SCHULDHULP_JSON_SCHEMA_URL: "https://raw.githubusercontent.com/VNG-Realisatie/ddas/main/{{.VERSION}}/json_schema_Uitwisselmodel.json"

tasks:
  # ==========================================================================
  # Install — Python-tooling in .venv
  # ==========================================================================
  install:
    desc: "Create the Python virtualenv (.venv) and install the tooling from requirements-tools.txt (crunch_uml, mkdocs, mike)."
    cmds:
      - |
        if command -v uv &> /dev/null; then
          echo "Creating .venv with uv (Python {{.PYTHON_VERSION}})..."
          uv venv --allow-existing --python {{.PYTHON_VERSION}} .venv
          uv pip install --python .venv/bin/python -r requirements-tools.txt
        elif command -v python{{.PYTHON_VERSION}} &> /dev/null; then
          echo "Creating .venv with python{{.PYTHON_VERSION}} -m venv..."
          python{{.PYTHON_VERSION}} -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-tools.txt
        else
          echo "Error: uv (aanbevolen) of python{{.PYTHON_VERSION}} is nodig om de .venv aan te maken."
          echo "crunch_uml ondersteunt Python < 3.14. Installeer uv via https://docs.astral.sh/uv/"
          exit 1
        fi
      - '"{{.VENV_BIN}}/python" -c "import importlib.metadata as m; print(\"Installed: \" + \", \".join(p + \" \" + m.version(p) for p in (\"crunch_uml\", \"mkdocs\", \"mike\")))"'
    shell: bash
    sources:
      - requirements.txt
      - requirements-tools.txt
    generates:
      - .venv/bin/crunch_uml
      - .venv/bin/mkdocs
      - .venv/bin/mike

  # ==========================================================================
  # Prepare — Voorwaarden valideren
  # ==========================================================================
  prepare:check-tools:
    desc: "Check for pre conditions. Verify required tools are installed (Python tooling in .venv)."
    deps: [install]
    cmds:
      - |
        # Python-tooling moet uit de .venv komen, niet uit een (verouderde) globale installatie
        missing_tools=()
        for tool in python crunch_uml mkdocs mike; do
          if [ ! -x "{{.VENV_BIN}}/$tool" ]; then
            missing_tools+=("$tool (.venv)")
          fi
        done
        if ! command -v git &> /dev/null; then
          missing_tools+=("git")
        fi

        # Meld ontbrekende tools en geef installatie-instructies
        if [ ${#missing_tools[@]} -ne 0 ]; then
          echo "Error: The following tools are not installed: ${missing_tools[*]}"
          echo "Run 'task install' (or 'task install --force') to (re)create the .venv."
          exit 1
        else
          echo "All required tools are installed."
        fi
    shell: bash

  prepare:check-vars:
    desc: "Check for pre conditions. Validate required variables VERSION and check if VERSION_DIR exist."
    cmds:
      - |
        # Valideer invoerparameters
        echo "Validating input parameter {{.VERSION}} ..."
      - |
        if [ -z "{{.VERSION}}" ]; then
          echo "Error: VERSION cannot be empty."
          exit 1
        fi
        if [[ ! "{{.VERSION}}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)*$ ]]; then
          echo "Error: Invalid VERSION format. Use v{number}.{number}, e.g., v1.0"
          exit 1
        fi
        if [ "./{{.VERSION}}" != "{{.VERSION_DIR}}" ]; then
          echo "Error: VERSION ({{.VERSION}}) does not match VERSION_DIR ({{.VERSION_DIR}}). Set VERSION in .env, not on the command line."
          exit 1
        fi
        if [ ! -d "{{.VERSION_DIR}}" ]; then
          echo "Error: Directory '{{.VERSION_DIR}}' does not exist."
          exit 1
        fi
      - |
        # Valideer invoerparameters
        echo "VERSION {{.VERSION}} and Versiondir {{.VERSION_DIR}} are valid..."
    shell: bash

  # ==========================================================================
  # Import — Model(len) inladen in Crunch UML
  # ==========================================================================
  import:model:
    desc: "Import the XMI file into Crunch UML Database."
    deps: [prepare:check-tools, prepare:check-vars]
    cmds:
      - |
        if [ ! -f "{{.XMI}}" ]; then
          echo "Error: XMI file '{{.XMI}}' does not exist."
          exit 1
        fi
      - echo "Importing XMI file '{{.XMI}}' into Crunch UML..."
      - '"{{.VENV_BIN}}/crunch_uml" import -f "{{.XMI}}" -t eaxmi -db_create'
      - echo "Extracting and tranforming schuldhulp datamodel..."
      - '"{{.VENV_BIN}}/crunch_uml" transform -ttp plugin -sch_to {{.IM_SCHEMA_SCHULDHULP}} -rt_pkg "{{.ROOT_IM_SCHULDHULP}}" --plugin_class_name {{.IM_TRANSFORMER_CLASS_SCHULDHULP}} --plugin_file_name {{.IM_TRANSFORMER_SCHULDHULP}}'
      - echo "Extracting and tranforming schuldhulp uitwisselmodel..."
      - '"{{.VENV_BIN}}/crunch_uml" transform -ttp plugin -sch_from {{.IM_SCHEMA_SCHULDHULP}} -sch_to {{.UM_SCHEMA_SCHULDHULP}} -rt_pkg "{{.ROOT_IM_SCHULDHULP}}" --plugin_class_name {{.UM_TRANSFORMER_SCHULDHULP_CLASS}} --plugin_file_name {{.UM_TRANSFORMER_SCHULDHULP}}'
      - echo "Crunch database successfully created and setup..."
    shell: bash
    sources:
      - "{{.XMI}}"
      - "{{.IM_TRANSFORMER_SCHULDHULP}}"
      - "{{.UM_TRANSFORMER_SCHULDHULP}}"
      - requirements-tools.txt
    generates:
      - "{{.CRUNCH_UML_DB}}"
    run: when_changed

  # ==========================================================================
  # Generate — Artifacts genereren uit het model
  # ==========================================================================
  generate:json-schema:
    desc: "Generate JSON Schema from uitwisselmodel {{.UM_SCHEMA_SCHULDHULP}}."
    deps: [import:model]
    cmds:
      - echo "Generate JSON Schema '{{.JSON}}' from schema '{{.UM_SCHEMA_SCHULDHULP}}' using root class '{{.ROOT_CLASS_UM_SCHULDHULP}}' with \$id '{{.SCHULDHULP_JSON_SCHEMA_URL}}'..."
      - '"{{.VENV_BIN}}/crunch_uml" -sch {{.UM_SCHEMA_SCHULDHULP}} -d export -t json_schema --output_class_id {{.ROOT_CLASS_UM_SCHULDHULP}} -js_url {{.SCHULDHULP_JSON_SCHEMA_URL}} -f {{.JSON}}'
      - echo "Post-processing JSON Schema (uniqueItems verwijderen, leveringen verplicht maken)..."
      - '"{{.VENV_BIN}}/python" tools/postprocess_jsonschema.py "{{.VERSION_DIR}}/json_schema_Uitwisselmodel.json"'
    shell: bash

  generate:docs:
    desc: "Generate Markdown documentation from the model."
    deps: [import:model]
    cmds:
      - echo "Generating Markdown documentation..."
      - mkdir -p "{{.DEFS}}"
      - rm -rf "{{.DEFS}}"/*.md
      - '"{{.VENV_BIN}}/crunch_uml" -sch {{.IM_SCHEMA_SCHULDHULP}} export -t jinja2 --output_jinja2_template ddas_markdown.j2 -f "{{.DEFS}}/{{.MD}}" --output_jinja2_templatedir ./tools/'
      - echo "Generating uitleg documentation using jinja template..."
      - '"{{.VENV_BIN}}/crunch_uml" -sch {{.IM_SCHEMA_SCHULDHULP}} export -t jinja2 --output_jinja2_template uitleg.j2 -f "{{.DOCS}}/{{.UITLEG}}" --output_jinja2_templatedir ./tools/'
      - |
        # Vervang de versies in de uitwisselspecificatie-templates
        # Loop door alle .template-bestanden in de directory en submappen
        echo "Processing template files in {{.DOCS}} ..."
        for file in $(find "{{.DOCS}}" -type f -name "*.template"); do
          # Bepaal de doelbestandnaam door ".template" te verwijderen
          output_file="${file%.template}"

          # Gebruik sed om de placeholder ###VERSION### te vervangen door de versie
          sed "s/###VERSION###/{{.VERSION}}/g" "$file" > "$output_file"

          # Geef een bericht over de verwerking
          echo "Processed $file -> $output_file"
        done
    shell: bash

  # ==========================================================================
  # Build — MkDocs site bouwen en valideren
  # ==========================================================================
  build:validate:
    desc: "Build the MkDocs documentation in strict mode to check for errors."
    deps: [generate:docs]
    cmds:
      - echo "Validating MkDocs documentation..."
      - '"{{.VENV_BIN}}/mkdocs" build --strict --site-dir /tmp/ddas-site'
      - echo "Documentation validation passed."
    shell: bash

  build:site:
    desc: "Build the MkDocs site."
    deps: [generate:docs]
    cmds:
      - echo "Building MkDocs site..."
      - '"{{.VENV_BIN}}/mkdocs" build --clean'
      - echo "Site built successfully."
    shell: bash

  build:serve:
    desc: "Start the local MkDocs development server (snelle preview, genereert geen docs vooraf — draai zo nodig eerst 'task generate:docs')."
    deps: [install]
    cmds:
      - echo "Starting MkDocs development server..."
      - '"{{.VENV_BIN}}/mkdocs" serve'
    shell: bash

  # ==========================================================================
  # Publish — Documentatie publiceren
  # ==========================================================================
  publish:local:
    desc: "Build and deploy the documentation locally using MkDocs and Mike. After deployment, use 'mike serve' or 'mkdocs serve' to view the results."
    deps: [generate:docs, generate:json-schema]
    cmds:
      - echo "Building and deploying MkDocs and Mike..."
      - '"{{.VENV_BIN}}/mkdocs" build --clean'
      - '"{{.VENV_BIN}}/mike" deploy "{{.VERSION}}" latest --update-aliases'
      - '"{{.VENV_BIN}}/mike" set-default "{{.VERSION}}"'
      - echo "Documentation deployed. Use '.venv/bin/mike serve' to view results..."
    shell: bash

  publish:github:
    desc: "Publish the documentation directly to GitHub Pages."
    deps: [publish:local]
    prompt:
     - Dit commando publiceert de documentatie direct naar de LIVE GitHub pages. Doorgaan?
     - Weet je het zeker?
    cmds:
      - echo 'Deploying to GitHub Pages...'
      - git push origin gh-pages

  publish:test:
    desc: "Publish the documentation to test location on host {{.FTP_HOST}}"
    deps: [publish:local]
    cmds:
      - echo 'Deploying to test location...'
      - lftp -e "set ssl:verify-certificate no; cd {{.FTP_REMOTE_DIR}}; mirror -R --delete --verbose ./{{.FTP_LOCAL_DIR}} .; bye" {{.FTP_HOST}}

  # ==========================================================================
  # Orchestratie
  # ==========================================================================
  full-deploy:
    desc: "Execute the entire deployment process: json-schema, and documentation"
    cmds:
      - task: publish:local
      - echo "Documentation deployment completed."
      - echo "Full deployment completed."
    shell: bash
